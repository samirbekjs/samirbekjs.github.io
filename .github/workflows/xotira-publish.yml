name: Xotira → data.json (auto-publish)

# Ishlatish:
# 1) GitHub → Issues → Labels da "publish" (va "published") label'larini yarating
# 2) Sayt formasidan ochildigan xotira Issue'siga "publish" label qo'ying
# 3) Workflow Issue kontentini data.json'ga qo'shib, commit qiladi

on:
  issues:
    types: [labeled]

jobs:
  publish:
    if: github.event.label.name == 'publish'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Parse issue & update data.json
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const fail = (msg) => github.rest.issues.createComment({
              owner, repo, issue_number: issue.number, body: '⚠️ ' + msg
            });

            // --- Issue body dan bo'limlarni ajratish ---
            const sections = {};
            for (const part of (issue.body || '').split(/^## /m).slice(1)) {
              const nl = part.indexOf('\n');
              if (nl < 0) continue;
              sections[part.slice(0, nl).trim()] = part.slice(nl + 1).trim();
            }
            const nameM = (sections['Muallif'] || '').match(/\*\*Ism:\*\*\s*(.+)/);
            const name = nameM ? nameM[1].trim().slice(0, 60) : 'Misafir';
            const content = (sections['Xotira'] || '').trim();

            if (content.length < 20) return fail('Xotira matni juda qisqa (kamida 20 belgi).');

            // --- data.json ni o'qish ---
            const raw = await github.rest.repos.getContent({ owner, repo, path: 'data.json' });
            const posts = JSON.parse(Buffer.from(raw.data.content, 'base64').toString('utf8'));

            const now = new Date();
            const MONTHS = ['Yanvar','Fevral','Mart','Aprel','May','Iyun','Iyul','Avgust','Sentyabr','Oktabr','Noyabr','Dekabr'];
            const firstLine = content.split('\n')[0].replace(/[*_#`]/g, '').trim().slice(0, 60);

            posts.unshift({
              id: posts.reduce((m, p) => Math.max(m, p.id || 0), 0) + 1,
              date: `${now.getUTCDate()}-${MONTHS[now.getUTCMonth()]}, ${now.getUTCFullYear()}`,
              date_iso: now.toISOString().slice(0, 10),
              time: now.toISOString().slice(11, 16),
              author: name,
              title: firstLine || 'Yangi xotira',
              cover_image: null,
              content: content,
              tags: [],
            });

            await github.rest.repos.createOrUpdateFileContents({
              owner, repo,
              path: 'data.json',
              message: `feat: yangi xotira (issue #${issue.number})`,
              content: Buffer.from(JSON.stringify(posts, null, 2) + '\n', 'utf8').toString('base64'),
              sha: raw.data.sha,
            });

            await github.rest.issues.createComment({
              owner, repo, issue_number: issue.number,
              body: `✅ Xotira daraxtga qo'shildi! (id: ${posts[0].id})\n\n${issue.html_url}`,
            });
            await github.rest.issues.addLabels({
              owner, repo, issue_number: issue.number, labels: ['published']
            }).catch(() => {});
